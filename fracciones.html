<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fracciones | Mi Espacio de Matemática</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .fracciones-visuales {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .opcion-fraccion {
            text-align: center;
        }

        .circulo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #333;
            margin: 0 auto 15px;
        }

        .mitad {
            background: linear-gradient(
                90deg,
                #f59e0b 50%,
                white 50%
            );
        }

        .cuarto {
            background: conic-gradient(
                #4f46e5 0deg 90deg,
                white 90deg 360deg
            );
        }

        .fraccion-grande {
            font-size: 32px;
            font-weight: bold;
        }

        #resultado {
            min-height: 60px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍕 Desafío de Fracciones</h1>
        <p>Observa las representaciones y selecciona la fracción mayor.</p>
    </header>

    <main class="contenedor">

        <div class="tarjeta">

            <h2>¿Cuál fracción representa una cantidad mayor?</h2>

            <p>Observa los dos círculos. Ambos representan enteros del mismo tamaño.</p>

            <div class="fracciones-visuales">

                <div class="opcion-fraccion">
                    <div class="circulo mitad"></div>

                    <div class="fraccion-grande">
                        1/2
                    </div>

                    <button class="boton" onclick="respuestaCorrecta()">
                        Elegir 1/2
                    </button>
                </div>

                <div class="opcion-fraccion">
                    <div class="circulo cuarto"></div>

                    <div class="fraccion-grande">
                        1/4
                    </div>

                    <button class="boton" onclick="respuestaIncorrecta()">
                        Elegir 1/4
                    </button>
                </div>

            </div>

            <h2 id="resultado"></h2>

        </div>

        <p style="text-align:center; margin-top:30px;">
            <a href="index.html" class="boton">
                🏠 Volver al inicio
            </a>
        </p>

    </main>

    <script>

        function respuestaCorrecta() {
            document.getElementById("resultado").innerHTML =
            "🎉 ¡Excelente! 1/2 es mayor que 1/4 porque la mitad ocupa una parte mayor del entero.";
        }

        function respuestaIncorrecta() {
            document.getElementById("resultado").innerHTML =
            "💡 Observa nuevamente. Cuando el entero se divide en menos partes iguales, cada parte es más grande.";
        }

    </script>

</body>

</html>
